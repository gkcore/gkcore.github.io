const LIC = {
  b64u:{
    de:u8 => { let s = ''; for (const b of u8) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
    para:s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; },
  },
  // código do computador: impressão digital do aparelho (não muda ao limpar o navegador)
  async codigo() {
    let gpu = '';
    try { const c = document.createElement('canvas').getContext('webgl'); const x = c && c.getExtension('WEBGL_debug_renderer_info'); gpu = x ? c.getParameter(x.UNMASKED_VENDOR_WEBGL) + '|' + c.getParameter(x.UNMASKED_RENDERER_WEBGL) : ''; } catch (e) {}

    return s.slice(0, 4) + '-' + s.slice(4, 8) + '-' + s.slice(8, 12);
  },
  // licença = dados.assinatura (ECDSA P-256)
  async verificar(texto, pubJwk) {
    try {
      const [d, a] = String(texto).trim().replace(/\s/g, '').split('.');
      if (!d || !a) return {ok:false, erro:'Chave de licença incompleta.'};
      const pub = await crypto.subtle.importKey('jwk', pubJwk, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);

      return {ok:true, p:JSON.parse(new TextDecoder().decode(LIC.b64u.para(d)))};
    } catch (e) { return {ok:false, erro:'Chave de licença inválida.'}; }
  },
  // situação: ok / aviso (vence em até 5 dias) / tolerancia (vencida há até 3 dias) / vencida / maquina / relogio
  async situacao(p) {
    const agora = Date.now();

    if (maior && agora < maior - 36 * 3600e3) return {s:'relogio'};
    try { localStorage.setItem('gkcore-lic-visto', String(Math.max(maior, agora))); } catch (e) {}
    if (p.maquinas && p.maquinas.length) { const c = await LIC.codigo(); if (!p.maquinas.includes(c)) return {s:'maquina', codigo:c}; }
    if (p.tipo === 'vitalicia' || !p.ate) return {s:'ok'};
    const fim = new Date(p.ate + 'T23:59:59').getTime(), dias = Math.ceil((fim - agora) / 864e5);
    if (dias >= 0) return {s:dias <= 5 ? 'aviso' : 'ok', dias};
    if (dias >= -3) return {s:'tolerancia', dias};
    return {s:'vencida', dias};
  },

const ONLINE = /^https?:$/.test(location.protocol);
if (ONLINE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const ls = {get:k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set:(k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
// lista online da fornecedora (assinada): renovações e bloqueios. Sem internet, segue sem ela.
async function lerLista() {
  if (!ONLINE) return null;
  try {
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 4000);
    const r = await fetch('lista.json?t=' + Date.now(), {cache:'no-store', signal:ac.signal}); clearTimeout(to);
    if (!r.ok) return null;
    const [d, a] = String((await r.json()).lista || '').split('.');
    const pub = await crypto.subtle.importKey('jwk', PUB, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
    if (!await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, pub, LIC.b64u.para(a), LIC.b64u.para(d))) return null;
    const txt = new TextDecoder().decode(LIC.b64u.para(d));
    if (!txt.startsWith('GKLISTA:')) return null;
    const L = JSON.parse(txt.slice(8)), visto = +ls.get('gkcore-lista-data') || 0;
    if (!(L.data >= visto)) return null; // lista mais velha que a já vista: ignora
    ls.set('gkcore-lista-data', String(L.data));
    return L;
  } catch (e) { return null; }
}
async function aplicarLista(t, r) {
  const L = await lerLista();
  if (L) {
    for (let n = 0; n < 5 && L.renovar && L.renovar[r.p.serie]; n++) {
      const nt = L.renovar[r.p.serie], nr = await LIC.verificar(nt, PUB);
      if (!nr.ok || nr.p.serie === r.p.serie) break;
      t = nt; r = nr; ls.set('gkcore-licenca', t);
    }
    ls.set('gkcore-bloqueada', (L.bloquear || []).includes(r.p.serie) ? r.p.serie : '');
  }
  return {t, r, bloq:ls.get('gkcore-bloqueada') === r.p.serie};
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
async function abrir(texto, p) {
  const key = await crypto.subtle.importKey('raw', LIC.b64u.para(p.k), 'AES-GCM', false, ['decrypt']), u = LIC.b64u.para(DADOS);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0, 12)}, key, u.slice(12)));
  const final = html.replace('null /*__GK_LIC__*/', () => JSON.stringify({texto, p, pub:PUB}));
  document.open(); document.write(final); document.close();
}
async function tela(erro, p) {
  const cod = await LIC.codigo(), w = String(p?.whats || '').replace(/\D/g, '');
  document.getElementById('box').innerHTML = `<div class="top"><div class="logo">GK</div><div><h1>Ativar o GK Core</h1><div class="muted">versão 1.0</div></div></div>
    ${erro ? `<div class="msg">${erro}</div>` : '<p class="muted">Cole a chave de licença que você recebeu. Se ela for só para alguns computadores, mande antes este código para o fornecedor:</p>'}
    <div class="muted">Código deste computador</div><div class="cod">${cod}</div>
    ${p ? `<p class="muted">${esc(p.fornecedor || 'Fornecedor')}${w ? ` · <a href="https://wa.me/${w}" target="_blank" rel="noopener">WhatsApp ${esc(p.whats)}</a>` : ''}${p.email ? ' · ' + esc(p.email) : ''}</p>` : ''}
    <textarea id="chave" placeholder="cole aqui a chave de licença"></textarea>
    <button id="ativar">Ativar</button>`;
  document.getElementById('ativar').onclick = async () => {
    let t = document.getElementById('chave').value.trim(); if (!t) return;
    let r = await LIC.verificar(t, PUB);
    if (!r.ok) return tela(r.erro);
    const x = await aplicarLista(t, r); t = x.t; r = x.r;
    if (x.bloq) return tela('Essa licença está suspensa. Fale com o fornecedor.', r.p);
    const s = await LIC.situacao(r.p);
    if (s.s === 'maquina') return tela('Essa chave não é para este computador. Mande o código acima para o fornecedor.', r.p);
    if (s.s === 'relogio') return tela('A data do computador está errada. Acerte a data e a hora e tente de novo.', r.p);
    if (s.s === 'vencida') return tela('Essa chave está vencida. Peça a renovação ao fornecedor.', r.p);
    try { localStorage.setItem('gkcore-licenca', t); } catch (e) {}
    abrir(t, r.p).catch(() => tela('Essa chave não abre esta cópia do GK Core (foi feita para outra). Fale com o fornecedor.', r.p));
  };
}
(async () => {
  let t = ls.get('gkcore-licenca');
  if (!t) return tela();
  let r = await LIC.verificar(t, PUB);
  if (!r.ok) return tela('A chave guardada não vale mais. Cole uma nova.');
  const x = await aplicarLista(t, r); t = x.t; r = x.r;
  if (x.bloq) return tela('Esta licença está suspensa. Fale com o fornecedor para liberar.', r.p);
  const s = await LIC.situacao(r.p);
  if (s.s === 'vencida') return tela(`A licença venceu em ${r.p.ate.split('-').reverse().join('/')}. Os seus dados estão guardados; é só renovar.`, r.p);
  if (s.s === 'maquina') return tela('Este computador não está na licença. Mande o código abaixo para o fornecedor.', r.p);
  if (s.s === 'relogio') return tela('A data do computador está errada. Acerte a data e a hora e abra de novo.', r.p);
  abrir(t, r.p).catch(() => tela('Essa chave não abre esta cópia do GK Core. Fale com o fornecedor.', r.p));
})();
