<title>GK Core</title>

<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 20% -10%,#2a0d10,transparent),#0b0d11;color:#e7e9ec;font:14px/1.5 "Segoe UI",system-ui,sans-serif;padding:16px}
.box{width:min(460px,100%);background:#161a20;border:1px solid #272c34;border-radius:14px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.top{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:46px;height:46px;flex:none;display:inline-block;filter:drop-shadow(0 3px 10px rgba(229,56,59,.35))}
h1{margin:0;font-size:20px}h1 span{color:#ff5a5f}.muted{color:#9aa2ad;font-size:13px}
label{display:block;margin-top:12px}label span{display:block;font-size:12px;font-weight:600;color:#9aa2ad;margin-bottom:4px}
input{width:100%;font:15px inherit;font-family:inherit;color:inherit;background:#0f1216;border:1px solid #2c323b;border-radius:8px;padding:10px 12px}input:focus{outline:2px solid #e5383b;outline-offset:-1px}
.cod{font:700 20px Consolas,monospace;letter-spacing:2px;background:#0f1216;border:1px dashed #3a414b;border-radius:8px;padding:9px;text-align:center;margin:6px 0 4px;user-select:all}
textarea{width:100%;min-height:100px;font:12px Consolas,monospace;color:inherit;background:#0f1216;border:1px solid #272c34;border-radius:8px;padding:9px;margin-top:8px}
button{margin-top:16px;width:100%;border:0;border-radius:9px;padding:12px;font:600 15px inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(180deg,#e5383b,#b5161b)}button:disabled{opacity:.6;cursor:wait}
.msg{background:#2e2410;border:1px solid #5a4416;color:#f3cf7a;border-radius:8px;padding:9px 12px;margin:12px 0 0;font-size:13px}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px}
a{color:#ff8a8a;cursor:pointer}
</style>

  async situacao(p) {

    const fim = new Date(p.ate + 'T23:59:59').getTime(), dias = Math.ceil((fim - agora) / 864e5);

    if (dias >= -3) return {s:'tolerancia', dias};
    return {s:'vencida', dias};
  },

async function chamar(rota, corpo, ms = 8000) {

  try { const r = await fetch(API + rota, {method:'POST', body:JSON.stringify(corpo), signal:ac.signal}); clearTimeout(to); return await r.json(); }
  catch (e) { clearTimeout(to); return {semRede:true}; }
}
// lista online (para quem usa chave): renovações e bloqueios
async function lerLista() {
  if (!ONLINE) return null;
  try {
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 4000);
    const r = await fetch('lista.json?t=' + Date.now(), {cache:'no-store', signal:ac.signal}); clearTimeout(to);
    if (!r.ok) return null;
    const [d, a] = String((await r.json()).lista || '').split('.');
    const pub = await crypto.subtle.importKey('jwk', PUB, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
    if (!await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, pub, LIC.b64u.para(a), LIC.b64u.para(d))) return null;
    const txt = new TextDecoder().decode(LIC.b64u.para(d));
    if (!txt.startsWith('GKLISTA:')) return null;
    const L = JSON.parse(txt.slice(8)), visto = +ls.get('gkcore-lista-data') || 0;
    if (!(L.data >= visto)) return null;
    ls.set('gkcore-lista-data', String(L.data));
    return L;
  } catch (e) { return null; }
}
async function aplicarLista(t, r) {
  const L = await lerLista();
  if (L) {
    for (let n = 0; n < 5 && L.renovar && L.renovar[r.p.serie]; n++) {
      const nt = L.renovar[r.p.serie], nr = await LIC.verificar(nt, PUB);
      if (!nr.ok || nr.p.serie === r.p.serie) break;
      t = nt; r = nr; ls.set('gkcore-licenca', t);
    }
    ls.set('gkcore-bloqueada', (L.bloquear || []).includes(r.p.serie) ? r.p.serie : '');
  }
  return {t, r, bloq:ls.get('gkcore-bloqueada') === r.p.serie};
}
async function abrir(texto, p) {
  const key = await crypto.subtle.importKey('raw', LIC.b64u.para(p.k), 'AES-GCM', false, ['decrypt']), u = LIC.b64u.para(DADOS);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0, 12)}, key, u.slice(12)));
  const final = html.replace('null /*__GK_LIC__*/', () => JSON.stringify({texto, p, pub:PUB}));
  document.open(); document.write(final); document.close();
}

// guarda a licença que veio do servidor e abre o programa
async function entrouComConta(r, email, codigo) {

  if (!v.ok) return telaLogin('Não foi possível abrir. Tente de novo.');
  const s = await LIC.situacao(v.p);
  if (s.s === 'relogio') return telaLogin('A data do computador está errada. Acerte a data e a hora e tente de novo.');
  abrir(r.token, v.p).catch(() => telaLogin('Esta versão do GK Core não abriu com a sua conta. Fale com o fornecedor.'));

function telaLogin(erro, email) {

    if (!em || !se) return telaLogin('Preencha o e-mail e a senha.', em);

  document.getElementById('se').onkeydown = e => { if (e.key === 'Enter') go(); };
