<title>GK Core</title>

<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 20% -10%,#2a0d10,transparent),#0b0d11;color:#e7e9ec;font:14px/1.5 "Segoe UI",system-ui,sans-serif;padding:16px}
.box{width:min(460px,100%);background:#161a20;border:1px solid #272c34;border-radius:14px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.top{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:46px;height:46px;flex:none;display:inline-block;filter:drop-shadow(0 3px 10px rgba(229,56,59,.35))}
h1{margin:0;font-size:20px}h1 span{color:#ff5a5f}.muted{color:#9aa2ad;font-size:13px}
label{display:block;margin-top:12px}label span{display:block;font-size:12px;font-weight:600;color:#9aa2ad;margin-bottom:4px}
input{width:100%;font:15px inherit;font-family:inherit;color:inherit;background:#0f1216;border:1px solid #2c323b;border-radius:8px;padding:10px 12px}input:focus{outline:2px solid #e5383b;outline-offset:-1px}
.cod{font:700 20px Consolas,monospace;letter-spacing:2px;background:#0f1216;border:1px dashed #3a414b;border-radius:8px;padding:9px;text-align:center;margin:6px 0 4px;user-select:all}
textarea{width:100%;min-height:100px;font:12px Consolas,monospace;color:inherit;background:#0f1216;border:1px solid #272c34;border-radius:8px;padding:9px;margin-top:8px}
button{margin-top:16px;width:100%;border:0;border-radius:9px;padding:12px;font:600 15px inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(180deg,#e5383b,#b5161b)}button:disabled{opacity:.6;cursor:wait}
.msg{background:#2e2410;border:1px solid #5a4416;color:#f3cf7a;border-radius:8px;padding:9px 12px;margin:12px 0 0;font-size:13px}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px}
a{color:#ff8a8a;cursor:pointer}
</style>

  async situacao(p) {

    const fim = new Date(p.ate + 'T23:59:59').getTime(), dias = Math.ceil((fim - agora) / 864e5);

    if (dias >= -3) return {s:'tolerancia', dias};
    return {s:'vencida', dias};
  },
